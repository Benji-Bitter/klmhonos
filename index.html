<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KLMHONOS // ARCHIVE 00</title>
    <style>
        /* --- RESET & VARIABLES --- */
        :root {
            --bg-color: #080808;
            --surface-color: #111111;
            --text-main: #f4f4f4;
            --text-muted: #777777;
            --accent: #ccff00; /* Acid volt accent */
            --border-color: #242424;
            --font-display: 'Helvetica Neue', Arial, sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            selection-background-color: var(--accent);
            selection-color: var(--bg-color);
        }

        ::selection {
            background: var(--accent);
            color: var(--bg-color);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-mono);
            overflow-x: hidden;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* --- SUBTLE NOISE OVERLAY --- */
        .noise {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.035;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://w3.org id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* --- NAVIGATION --- */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2.5rem;
            border-bottom: 1px solid var(--border-color);
            background: rgba(8, 8, 8, 0.85);
            backdrop-filter: blur(10px);
            z-index: 100;
            font-size: 0.75rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .brand-mark {
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: var(--accent);
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            margin-left: 2rem;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: var(--text-main);
        }

        /* --- HERO SECTION --- */
        .hero {
            min-height: 92vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 8rem 2.5rem 2.5rem 2.5rem;
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }

        .hero-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .hero-title-wrapper {
            margin: auto 0;
        }

        h1 {
            font-family: var(--font-display);
            font-size: clamp(3.5rem, 13vw, 13rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 0.9;
            text-transform: uppercase;
            margin-left: -0.05em;
        }

        .hero-sub {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            max-width: 460px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* --- MARQUEE --- */
        .marquee-container {
            width: 100%;
            overflow: hidden;
            border-bottom: 1px solid var(--border-color);
            padding: 0.85rem 0;
            background: var(--surface-color);
            white-space: nowrap;
        }

        .marquee-content {
            display: inline-block;
            animation: marquee 22s linear infinite;
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .marquee-content span {
            color: var(--accent);
            margin: 0 1.5rem;
        }

        /* --- GRID / MANIFESTO & SPOTIFY --- */
        .grid-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            border-bottom: 1px solid var(--border-color);
        }

        .grid-box {
            padding: 4rem 2.5rem;
        }

        .grid-box:first-child {
            border-right: 1px solid var(--border-color);
        }

        .section-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--text-muted);
            margin-bottom: 2rem;
            display: block;
        }

        .manifesto-text {
            font-family: var(--font-display);
            font-size: clamp(1.5rem, 2.5vw, 2.25rem);
            font-weight: 500;
            line-height: 1.25;
            letter-spacing: -0.02em;
        }

        .manifesto-details {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            border-top: 1px solid var(--border-color);
            padding-top: 1.5rem;
        }

        /* --- SPOTIFY MODULE --- */
        .spotify-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            transition: border-color 0.3s ease;
        }

        .spotify-card:hover {
            border-color: var(--accent);
        }

        .spotify-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 2.5rem;
        }

        .equalizer {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 18px;
        }

        .bar {
            width: 3px;
            background-color: var(--accent);
            animation: eq 1s ease-in-out infinite alternate;
        }

        .bar:nth-child(1) { height: 60%; animation-delay: 0.1s; }
        .bar:nth-child(2) { height: 100%; animation-delay: 0.3s; }
        .bar:nth-child(3) { height: 40%; animation-delay: 0.5s; }
        .bar:nth-child(4) { height: 85%; animation-delay: 0.2s; }

        .spotify-title {
            font-family: var(--font-display);
            font-size: 1.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        .spotify-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
        }

        .spotify-btn {
            display: inline-flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 1.1rem 1.5rem;
            background-color: var(--text-main);
            color: var(--bg-color);
            text-decoration: none;
            font-weight: bold;
            font-size: 0.8rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .spotify-btn:hover {
            background-color: var(--accent);
            color: var(--bg-color);
        }

        /* --- INDEX / ARCHIVE LOGS (NO MERCH) --- */
        .archive-list {
            padding: 4rem 2.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .log-row {
            display: grid;
            grid-template-columns: 100px 2fr 1fr 120px;
            padding: 1.25rem 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.8rem;
            text-transform: uppercase;
            align-items: center;
            transition: padding-left 0.2s ease, color 0.2s ease;
        }

        .log-row:hover {
            padding-left: 0.75rem;
            color: var(--accent);
        }

        .log-row:first-of-type {
            border-top: 1px solid var(--border-color);
        }

        .log-status {
            text-align: right;
            color: var(--text-muted);
        }

        /* --- FOOTER --- */
        footer {
            padding: 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .footer-links a {
            color: var(--text-main);
            text-decoration: none;
            margin-left: 1.5rem;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s ease;
        }

        .footer-links a:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* --- ANIMATIONS --- */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @keyframes marquee {
            0% { transform: translateX(0%); }
Use code with caution.
100% { transform: translateX(-50%); }
}
@keyframes eq {
0% { height: 20%; }
100% { height: 100%; }
}
/* --- RESPONSIVE --- */
@media (max-width: 850px) {
header { padding: 1.25rem 1.5rem; }
.hero { padding: 7rem 1.5rem 2rem 1.5rem; min-height: 80vh; }
.grid-section { grid-template-columns: 1fr; }
.grid-box { padding: 3rem 1.5rem; }
.grid-box:first-child { border-right: none; border-bottom: 1px solid var(--border-color); }
.archive-list { padding: 3rem 1.5rem; }
.log-row { grid-template-columns: 70px 1fr auto; gap: 1rem; }
.log-location { display: none; }
footer { flex-direction: column; gap: 1.5rem; text-align: center; padding: 2rem 1.5rem; }
.footer-links a { margin: 0 0.75rem; }
}
